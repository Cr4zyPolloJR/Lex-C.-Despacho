version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: lexdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
